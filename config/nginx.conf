resolver 127.0.0.11 valid=5s ipv6=off;
upstream dashboard_backend {
    zone dashboard_backend 64k;
    server backend:8000 resolve;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;
    location = /api/v1/replay/load { proxy_pass http://dashboard_backend; proxy_read_timeout 30s; }
    location /api/ { proxy_pass http://dashboard_backend; proxy_read_timeout 5s; }
    location = /health { proxy_pass http://dashboard_backend; }
    location = /docs { proxy_pass http://dashboard_backend; }
    location = /openapi.json { proxy_pass http://dashboard_backend; }
    location = /redoc { proxy_pass http://dashboard_backend; }
    location = /config.js { add_header Cache-Control "no-store"; }
    location / { try_files $uri $uri/ =404; add_header Cache-Control "no-cache"; }
}
